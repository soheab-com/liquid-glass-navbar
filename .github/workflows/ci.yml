name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint and format
        run: npm run lint
      - name: Documentation links
        run: npm run check:links
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Import without a DOM
        run: npm run test:ssr
      - name: Bundle size
        run: npm run size
      - name: Pack and install
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/soheab-com-liquid-glass-navbar-*.tgz
          node --input-type=module -e "const m = await import('@soheab-com/liquid-glass-navbar'); if (typeof m.mountLiquidGlassNavbar !== 'function') process.exit(1);"
          test -f node_modules/@soheab-com/liquid-glass-navbar/dist/navbar.css

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
