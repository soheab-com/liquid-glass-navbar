<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hover navigation</title>
<link rel="stylesheet" href="../src/navbar.css">
<style>
  section { min-height: 100vh; }
  nav { position: fixed !important; left: 30px; bottom: 18px; display: flex; }
  #sub { bottom: 92px; }
</style>
<section id="one"><h2>One</h2></section>
<section id="two"><h2>Two</h2></section>
<section id="three"><h2>Three</h2></section>
<nav id="main" aria-label="Main navigation">
  <a href="#one" aria-current="page">One</a>
  <a href="#two">Two</a>
</nav>
<nav id="sub" aria-label="Related navigation"><a href="#three">Three</a></nav>
<script type="module" src="./hover-navigation.js"></script>
</html>
