<title>Glass over an unmarked backdrop</title>
<link rel="stylesheet" href="../src/navbar.css">
<style>
  body { margin: 0; font: 16px/1.4 system-ui; }
  .backdrop {
    position: fixed; inset: 0; padding: 24px; overflow: hidden;
    background:
      repeating-linear-gradient(90deg, rgb(0 0 0 / .12) 0 2px, transparent 2px 22px),
      linear-gradient(135deg, #ff8a5c, #6b5bff 55%, #19c3a7);
    color: white; font-size: 22px; font-weight: 700;
  }
  .backdrop p { margin: 0 0 12px; }
  .wide .lg-navbar [data-navbar-label] { padding-inline: 18px; }
</style>
<div class="backdrop" aria-hidden="true"></div>
<nav id="nav" aria-label="Glass test">
